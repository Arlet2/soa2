spring.application.name=soa2

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver
server.servlet.context-path=/api/v1
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.resources.add-mappings=false

server.port=9981
server.ssl.enabled=true
security.require-ssl=true

server.ssl.key-store-type=PKCS12
server.ssl.key-store=zarf/cert.p12
server.ssl.key-store-password=test123
server.ssl.key-alias=soa2

spring.flyway.enabled=true

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.health-check-path=/api/v1/health
spring.cloud.consul.discovery.health-check-tls-skip-verify=true
spring.cloud.consul.discovery.scheme=https
spring.cloud.consul.discovery.health-check-critical-timeout=10s
spring.cloud.consul.discovery.hostname=host.docker.internal